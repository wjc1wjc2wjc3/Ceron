apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ceron
  labels: { app: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ceron/frontend:latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: ceron-config }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ceron
spec:
  selector: { app: frontend }
  ports:
    - { port: 3000, targetPort: 3000 }
