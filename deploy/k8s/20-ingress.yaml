apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ceron-ingress
  namespace: ceron
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"   # 可选：配合 cert-manager 自动签发
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["ceron.example.com"]
      secretName: ceron-tls
  rules:
    - host: ceron.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 3000 } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: go-svc, port: { number: 8080 } } }
          - path: /v1
            pathType: Prefix
            backend: { service: { name: go-svc, port: { number: 8080 } } }
          - path: /gateway
            pathType: Prefix
            backend: { service: { name: go-svc, port: { number: 8080 } } }
          - path: /health
            pathType: Prefix
            backend: { service: { name: go-svc, port: { number: 8080 } } }
          - path: /docs
            pathType: Prefix
            backend: { service: { name: go-svc, port: { number: 8080 } } }
          - path: /openapi.json
            pathType: Prefix
            backend: { service: { name: go-svc, port: { number: 8080 } } }
