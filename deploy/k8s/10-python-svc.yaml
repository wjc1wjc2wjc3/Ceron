apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-svc
  namespace: ceron
  labels: { app: python-svc }
spec:
  replicas: 2
  selector:
    matchLabels: { app: python-svc }
  template:
    metadata:
      labels: { app: python-svc }
    spec:
      containers:
        - name: python-svc
          image: ceron/python-svc:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: ceron-config }
            - secretRef: { name: ceron-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: python-svc
  namespace: ceron
spec:
  selector: { app: python-svc }
  ports:
    - { port: 8000, targetPort: 8000 }
