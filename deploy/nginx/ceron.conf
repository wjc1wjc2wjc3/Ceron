# Ceron — Nginx 反向代理 + TLS
# 适用：生产统一入口。前置：python-svc(:8000) / go-svc(:8080) / frontend(:3000) 已运行
# （裸机、Docker 或 K8s 内均可，只要 upstream 地址可达）。
#
# 放置位置（见 DEPLOYMENT.md §Nginx）：
#   Linux : /etc/nginx/sites-available/ceron.conf  -> 软链到 sites-enabled
#   macOS : /opt/homebrew/etc/nginx/servers/ceron.conf (Apple Silicon)
#           /usr/local/etc/nginx/servers/ceron.conf (Intel)
#   Win   : C:\nginx\conf\ceron.conf，并在 nginx.conf 的 http 块内 `include ceron.conf;`

upstream ceron_frontend { server 127.0.0.1:3000; }   # 或容器名/Service 名
upstream ceron_go       { server 127.0.0.1:8080; }

server {
    listen 80;
    server_name ceron.example.com;
    # 强制跳转 HTTPS（如需）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ceron.example.com;

    ssl_certificate     /etc/nginx/ssl/ceron.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ceron.privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 上传保单/月结单扫描件（OCR）需放宽体积
    client_max_body_size 25m;

    # —— 前端页面与静态资源 ——
    location / {
        proxy_pass http://ceron_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # —— 网关 API（前端 /api/* 与直接调用 /v1 /gateway /health 都走这里）——
    location ~ ^/(api|v1|gateway|health|docs|openapi\.json)(/|$) {
        proxy_pass http://ceron_go;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;   # 大模型/流水线可能耗时
        proxy_send_timeout 120s;
    }
}
